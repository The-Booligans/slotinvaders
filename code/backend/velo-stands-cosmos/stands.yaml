# Slot Invaders — single source of truth for areas, stands and devices.
#
# Shape and rules: see documentation/architecture.md ("Config file").
# Sensor choices per stand come from documentation/sensor-evaluation.md.
#
# Added for the Cosmos DB catalog (all optional, the architecture fields are unchanged):
#   stands[].name          readable name, shown in the app
#   stands[].location      GPS position { lat, lon } for "nearest free stand"
#   stands[].locationNote  where to find the stand, in words
#   devices[].name         readable name, used in logs and the admin view
#   devices[].status       active | maintenance | retired
#
# Which device watches which stand: devices[].stand. The import turns it into
# an open device assignment. When a device is replaced, list its history under
# `assignments:` instead (see the example at the end of this file).
#
# All slot counts are placeholders until Endress+Hauser confirms real
# capacities.
#
# Device keys: keyHash is "sha256:" + the SHA-256 (lowercase hex) of the
# device's secret API key. The secret is flashed to the device, sent as
# X-Api-Key and never committed; the API hashes what it receives and compares
# it with keyHash. To get the keyHash of a secret, or a new random secret:
#   node scripts/new-device-key.js <secret>
#   node scripts/new-device-key.js
#
# Device IDs are StarCraft units. Short, memorable, pronounceable over Slack
# when something misbehaves ("the raven is stale again").

version: 1

site:
  id: reinach
  name: Endress+Hauser Reinach
  timezone: Europe/Zurich

areas:
  - id: kaegen-hof
    name: Kägenstrasse 2 – Hof
    kind: open # open rack · ~72 × 42 m
  - id: flow-west
    name: Flowtec – West
    kind: open # open rack · ~55 × 64 m
  - id: cmr-ost
    name: Christoph Merian-Ring – Ost
    kind: open # open rack · ~35 × 24 m
  - id: cmr-sued
    name: Christoph Merian-Ring – Süd
    kind: open # open rack · ~37 × 27 m
  - id: velo-ds
    name: Veloparking Digital Solutions
    kind: covered # covered garage · ~78 × 46 m
  - id: velo-flow
    name: Veloparking Flowtec
    kind: covered # covered garage · ~36 × 41 m

stands:
  - id: kaegen-hof-1
    area: kaegen-hof
    name: Kägenstrasse 2 – Hof, Stand 1
    slots: 40
    # location: { lat: 0.0, lon: 0.0 }   # TODO: GPS position of the stand
  - id: flow-west-1
    area: flow-west
    name: Flowtec – West, Stand 1
    slots: 60
    # location: { lat: 0.0, lon: 0.0 }   # TODO
  - id: cmr-ost-1
    area: cmr-ost
    name: Christoph Merian-Ring – Ost, Stand 1
    slots: 20
    # location: { lat: 0.0, lon: 0.0 }   # TODO
  - id: cmr-sued-1
    area: cmr-sued
    name: Christoph Merian-Ring – Süd, Stand 1
    slots: 25
    # location: { lat: 0.0, lon: 0.0 }   # TODO
  - id: velo-ds-1
    area: velo-ds
    name: Veloparking Digital Solutions, Stand 1
    slots: 80
    # location: { lat: 0.0, lon: 0.0 }   # TODO
  - id: velo-flow-1
    area: velo-flow
    name: Veloparking Flowtec, Stand 1
    slots: 45
    # location: { lat: 0.0, lon: 0.0 }   # TODO

devices:
  # Kägenstrasse Hof — LiDAR sweeps the far row, ToF covers the near one.
  - id: thor
    name: Kägenstrasse Hof – LiDAR, far row
    stand: kaegen-hof-1
    hardware: rplidar-c1
    mode: device
    status: active
    keyHash: "sha256:2402a58aea192bb6ae85d91417bb5730c773d232ba3a445a21ef08c72606b845"
    config:                       # thor fetches these at boot from /v1/device/config
      slots: 8                    # how many slot bays the LiDAR arc is split into
      occupiedMm: 650             # slot ≤ this → bike
      freeMm: 850                 # slot ≥ this → free; between → keep previous
      bikeRangeMinMm: 250         # calibration: ignore returns closer than this
      bikeRangeMaxMm: 1800        # calibration: ignore returns farther than this
      emaAlpha: 0.3               # smoothing of the per-slot nearest return
      stableLatch: 3              # consecutive scans before flipping a slot
      calibrationMs: 8000         # how long the direction-learning window lasts
      reportIntervalMs: 10000     # how often to POST /v1/readings
  - id: probe
    name: Kägenstrasse Hof – ToF, near row
    stand: kaegen-hof-1
    hardware: vl53l5cx-array
    mode: device
    status: active
    keyHash: "sha256:d1421a31bfee87096d7e5d3ec495d331e6ef401793b2b42023fca81ca5ec6869"

  # Flowtec West — biggest open rack; one ESP32-CAM on cloud as plan-B fallback.
  - id: drone
    name: Flowtec West – camera (cloud fallback)
    stand: flow-west-1
    hardware: esp32-s3-cam
    mode: cloud
    status: active
    keyHash: "sha256:e7eba53c1cd0243c57de1c802351165d484cdd3c55979b39bc2849e7e7640241"
  - id: mule
    name: Flowtec West – on-device YOLO
    stand: flow-west-1
    hardware: atoms3r-cam-m12-yolo # on-device YOLO bike detector; firmware in code/firmware/mule
    mode: device
    status: active
    keyHash: "sha256:1a13f32ec1c43f636419c800029c277870c4ecc2d96041f04892daae9415a357"

  # Christoph Merian-Ring Ost — small open rack, one mmWave head.
  - id: ling
    name: CMR Ost – mmWave
    stand: cmr-ost-1
    hardware: mr24hpc1-mmwave
    mode: device
    status: active
    keyHash: "sha256:e09f6a2aade818a2e1a3f535a0346d3e6b9754ada1a2a08d5cc80957949d7fbb"

  # Christoph Merian-Ring Süd — mmWave + ToF cross-check.
  - id: roach
    name: CMR Süd – mmWave
    stand: cmr-sued-1
    hardware: mr24hpc1-mmwave
    mode: device
    status: active
    keyHash: "sha256:df2093a5a22eb77ae787fa2920e6e986a3f5997ca7478ed5bc4a096d1efc4cb3"
  - id: hydra
    name: CMR Süd – ToF cross-check
    stand: cmr-sued-1
    hardware: vl53l5cx-array
    mode: device
    status: active
    keyHash: "sha256:b8d713c3d4ac74d27b5cbe217b14c76120400f9e1774a4d0a6a5fdecfc84efd0"

  # Veloparking Digital Solutions — covered garage, one LiDAR sweep + ToF.
  - id: ghost
    name: Veloparking DS – LiDAR sweep
    stand: velo-ds-1
    hardware: rplidar-c1
    mode: device
    status: active
    keyHash: "sha256:c581feb715209c0212de3e5afc29761e64b181342934d1c9c9ab4115f4b29caa"
  - id: raven
    name: Veloparking DS – ToF
    stand: velo-ds-1
    hardware: vl53l5cx-array
    mode: device
    status: active
    keyHash: "sha256:0a40991a2ddd358f477ee5397b48badb1d03a9139f5fc99eb42bbdfad01ec4e1"

  # Veloparking Flowtec — covered garage, same recipe as Digital Solutions.
  - id: medic
    name: Veloparking Flowtec – LiDAR sweep
    stand: velo-flow-1
    hardware: rplidar-c1
    mode: device
    status: active
    keyHash: "sha256:51b06d29ad63cdf9748700666d8ae1eff88241f377922fc4a6b24c0290fdc571"
  - id: reaper
    name: Veloparking Flowtec – ToF
    stand: velo-flow-1
    hardware: vl53l5cx-array
    mode: device
    status: active
    keyHash: "sha256:f1e74e93eac6c960ce936b672e1a642a41e7c02f0221d9d426aaa0ca1bdbbf89"

# Device history, only needed once a device is replaced. Example: raven breaks
# and a new ToF array "viking" takes over on 2027-03-14:
#
#   devices:
#     - id: raven  … status: retired   (and remove its `stand:` line)
#     - id: viking … status: active    (no `stand:` line, the assignment below covers it)
#   assignments:
#     - { device: raven,  stand: velo-ds-1, from: 2026-10-31, to: 2027-03-14 }
#     - { device: viking, stand: velo-ds-1, from: 2027-03-14 }

recognition: # only used by cloud-mode (fallback) devices
  model: azure-ai-vision
  label: bicycle
  minConfidence: 0.5

settings:
  staleAfterSeconds: 300
  readingTtlDays: 30
