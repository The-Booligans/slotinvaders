name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-app:
    name: debug app · ${{ matrix.task }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/debug
    strategy:
      fail-fast: false
      matrix:
        task: [lint, format, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/debug/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: lint
        if: matrix.task == 'lint'
        run: pnpm lint

      - name: format
        if: matrix.task == 'format'
        run: |
          pnpm format
          git diff --exit-code

      - name: test
        if: matrix.task == 'test'
        run: pnpm coverage

      - name: upload coverage to Codecov
        if: matrix.task == 'test'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: code/debug/coverage/lcov.info
          flags: debug-app
          fail_ci_if_error: false
